name: slotly

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotly}
      POSTGRES_USER: ${POSTGRES_USER:-slotly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotly_local_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SlotlyDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-slotly};Username=${POSTGRES_USER:-slotly};Password=${POSTGRES_PASSWORD:-slotly_local_only}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_CONTAINER_PORT:-1025}
      Smtp__UseSsl: ${SMTP_USE_SSL:-false}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-notifications@slotly.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Slotly}
      BackgroundJobs__PendingBookingExpiryMinutes: ${PENDING_BOOKING_EXPIRY_MINUTES:-15}
      BackgroundJobs__RetentionDays: ${BACKGROUND_JOB_RETENTION_DAYS:-30}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__SuccessUrl: ${STRIPE_SUCCESS_URL:-http://localhost:8080/payments/success}
      Stripe__CancelUrl: ${STRIPE_CANCEL_URL:-http://localhost:8080/payments/cancel}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-http://localhost:5000}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-https://localhost:5001}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_3:-http://localhost:3000}
      Seq__Url: ${SEQ_URL:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-slotly-local-jwt-signing-key-change-before-deployment-2026}
      Jwt__Issuer: ${JWT_ISSUER:-slotly-api}
      Jwt__Audience: ${JWT_AUDIENCE:-slotly-clients}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      Jwt__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      Tenancy__BaseDomain: ${TENANCY_BASE_DOMAIN:-slotly.local}
      Tenancy__EnableSubdomainResolution: ${TENANCY_ENABLE_SUBDOMAIN_RESOLUTION:-true}
      Tenancy__EnableHeaderResolution: ${TENANCY_ENABLE_HEADER_RESOLUTION:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

  redis:
    profiles: ["redis"]
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    profiles: ["seq"]
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_HTTP_PORT:-8081}:80"
      - "${SEQ_INGEST_PORT:-5341}:5341"

volumes:
  postgres-data:
