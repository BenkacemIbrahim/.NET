<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-cap" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blue-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0069FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="avatar-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="avatar-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B1A2C" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1A2C" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-drawer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="24" fill="url(#bg-cap)"/>

  <!-- Main Card Container -->
  <g filter="url(#shadow-main)" transform="translate(60, 50)">
    <rect width="680" height="500" rx="24" fill="url(#card-grad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="680" height="56" rx="24" fill="#FFFFFF"/>
    <path d="M0 56 H680" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="36" cy="28" r="6" fill="#EF4444"/>
    <circle cx="56" cy="28" r="6" fill="#F59E0B"/>
    <circle cx="76" cy="28" r="6" fill="#10B981"/>

    <!-- Title & Status Badge -->
    <text x="110" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B1A2C">Slotly AI Notetaker · Live Meeting</text>
    
    <g transform="translate(540, 16)">
      <rect width="112" height="26" rx="13" fill="#FEF2F2" stroke="#FEE2E2"/>
      <circle cx="16" cy="13" r="4.5" fill="#EF4444">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DC2626">REC · 32:15</text>
    </g>

    <!-- Video Participants Grid (Left) -->
    <g transform="translate(32, 80)">
      <!-- Video tile 1 -->
      <rect width="330" height="180" rx="16" fill="#1E293B"/>
      <circle cx="165" cy="80" r="32" fill="url(#avatar-1)"/>
      <text x="165" y="87" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">SL</text>
      <rect x="16" y="140" width="125" height="26" rx="8" fill="#000000" fill-opacity="0.6"/>
      <text x="26" y="157" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Dr. Sarah Lin (Host)</text>
      <circle cx="304" cy="153" r="10" fill="#10B981"/>
      <path d="M300 153 L303 156 L308 150" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Video tile 2 -->
      <g transform="translate(0, 196)">
        <rect width="330" height="180" rx="16" fill="#0F172A"/>
        <circle cx="165" cy="80" r="32" fill="url(#avatar-2)"/>
        <text x="165" y="87" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">DM</text>
        <rect x="16" y="140" width="110" height="26" rx="8" fill="#000000" fill-opacity="0.6"/>
        <text x="26" y="157" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Dominic Mills</text>
      </g>
    </g>

    <!-- AI Transcription Drawer (Right) -->
    <g filter="url(#shadow-drawer)" transform="translate(382, 80)">
      <rect width="266" height="376" rx="18" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>

      <!-- Drawer header -->
      <g transform="translate(18, 20)">
        <rect width="30" height="30" rx="8" fill="#F3E8FF"/>
        <path d="M15 8 L16.5 13.5 L22 15 L16.5 16.5 L15 22 L13.5 16.5 L8 15 L13.5 13.5 Z" fill="#7C3AED"/>
        <text x="40" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B1A2C">AI Live Summary</text>
        <text x="40" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7280">Real-time action capture</text>
      </g>

      <!-- Audio waveform -->
      <g transform="translate(18, 68)">
        <rect width="230" height="42" rx="10" fill="#FAF5FF" stroke="#F3E8FF"/>
        <g transform="translate(14, 12)">
          <rect x="0" y="4" width="3" height="10" rx="1.5" fill="#A855F7"/>
          <rect x="7" y="2" width="3" height="14" rx="1.5" fill="#7C3AED"/>
          <rect x="14" y="0" width="3" height="18" rx="1.5" fill="#6366F1"/>
          <rect x="21" y="5" width="3" height="8" rx="1.5" fill="#A855F7"/>
          <rect x="28" y="1" width="3" height="16" rx="1.5" fill="#7C3AED"/>
          <rect x="35" y="3" width="3" height="12" rx="1.5" fill="#6366F1"/>
          <rect x="42" y="6" width="3" height="6" rx="1.5" fill="#A855F7"/>
          <rect x="49" y="0" width="3" height="18" rx="1.5" fill="#7C3AED"/>
          <rect x="56" y="2" width="3" height="14" rx="1.5" fill="#6366F1"/>
          <rect x="63" y="4" width="3" height="10" rx="1.5" fill="#A855F7"/>
          <text x="80" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6D28D9">Transcribing voice...</text>
        </g>
      </g>

      <!-- Takeaway 1 -->
      <g transform="translate(18, 126)">
        <rect width="230" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="16" cy="20" r="5" fill="#10B981"/>
        <text x="28" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1A2C">Key Decision</text>
        <text x="14" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4B5563">Approved bi-weekly follow-up plan.</text>
        <text x="14" y="56" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4B5563">Patient starts consultation on Friday.</text>
      </g>

      <!-- Action items -->
      <g transform="translate(18, 206)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1A2C">Action Items (3)</text>
        
        <g transform="translate(0, 24)">
          <rect width="230" height="34" rx="8" fill="#F0FDF4" stroke="#DCFCE7"/>
          <rect x="10" y="10" width="14" height="14" rx="4" fill="#10B981"/>
          <path d="M13 17 L16 20 L21 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
          <text x="32" y="21" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Send lab summary report</text>
        </g>

        <g transform="translate(0, 66)">
          <rect width="230" height="34" rx="8" fill="#EFF6FF" stroke="#DBEAFE"/>
          <rect x="10" y="10" width="14" height="14" rx="4" fill="#3B82F6"/>
          <path d="M13 17 L16 20 L21 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
          <text x="32" y="21" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1E40AF">Schedule 30m review slot</text>
        </g>

        <g transform="translate(0, 108)">
          <rect width="230" height="34" rx="8" fill="#FFFBEB" stroke="#FEF3C7"/>
          <circle cx="17" cy="17" r="7" fill="#F59E0B" fill-opacity="0.2"/>
          <circle cx="17" cy="17" r="3" fill="#D97706"/>
          <text x="32" y="21" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400E">Generate invoice deposit</text>
        </g>
      </g>
    </g>
  </g>
</svg>