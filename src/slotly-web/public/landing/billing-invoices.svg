<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="b-inv-bg" x1="0" y1="0" x2="900" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B1A2C" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1A2C" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="900" height="650" rx="28" fill="url(#b-inv-bg)"/>

  <g filter="url(#shadow-b)" transform="translate(100, 60)">
    <rect width="700" height="530" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Invoice Header -->
    <g transform="translate(36, 32)">
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748B" letter-spacing="1">INVOICE</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0B1A2C">#INV-2026-084</text>
      <text x="0" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Issued: Oct 30, 2026 · Due upon receipt</text>

      <g transform="translate(480, 16)">
        <rect width="148" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
        <circle cx="16" cy="16" r="4.5" fill="#3B82F6"/>
        <text x="28" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">Ready to Send</text>
      </g>
    </g>

    <path d="M36 120 H664" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Line items table -->
    <g transform="translate(36, 140)">
      <!-- Table Header -->
      <text x="16" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">DESCRIPTION</text>
      <text x="440" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">QTY</text>
      <text x="560" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">AMOUNT</text>

      <!-- Row 1 -->
      <g transform="translate(0, 36)">
        <rect width="628" height="56" rx="12" fill="#F8FAFC"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Clinical Assessment &amp; Strategy Consultation</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">60-minute in-depth session with action plan</text>
        <text x="448" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">1</text>
        <text x="560" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">$250.00</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 102)">
        <rect width="628" height="56" rx="12" fill="#F8FAFC"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Diagnostic Lab &amp; Follow-up Review</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Automated bloodwork panel analysis &amp; prep</text>
        <text x="448" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">1</text>
        <text x="560" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">$150.00</text>
      </g>
    </g>

    <!-- Total Summary Banner -->
    <g transform="translate(36, 324)">
      <rect width="628" height="88" rx="18" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1.5"/>
      <g transform="translate(24, 28)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Total Balance Due</text>
        <text x="0" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#14532D">$400.00 USD</text>
      </g>

      <g transform="translate(430, 26)">
        <rect width="170" height="36" rx="10" fill="#FFFFFF" stroke="#BBF7D0"/>
        <circle cx="20" cy="18" r="6" fill="#16A34A"/>
        <text x="36" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803D">Pay Online with 1-Click</text>
      </g>
    </g>

    <!-- Send CTA Button -->
    <g transform="translate(36, 440)">
      <rect width="628" height="52" rx="26" fill="#059669"/>
      <path d="M260 26 L268 31 L260 36 M268 31 H244" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="330" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send Professional Branded Invoice</text>
    </g>
  </g>
</svg>