<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-fu" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="primary-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069FF"/>
      <stop offset="100%" stop-color="#0056D6"/>
    </linearGradient>
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B1A2C" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1A2C" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg-fu)"/>

  <g filter="url(#shadow-main)" transform="translate(70, 50)">
    <rect width="660" height="500" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Banner -->
    <rect width="660" height="68" rx="24" fill="#FAFCFF"/>
    <path d="M0 68 H660" stroke="#EDF2F7" stroke-width="1.5"/>
    
    <g transform="translate(32, 18)">
      <rect width="32" height="32" rx="10" fill="#E8F3FF"/>
      <path d="M16 10 L17.5 15.5 L23 17 L17.5 18.5 L16 24 L14.5 18.5 L9 17 L14.5 15.5 Z" fill="#0069FF"/>
      <text x="44" y="21" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0B1A2C">Automated Post-Meeting Follow-up</text>
      <text x="44" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Sent via Slotly AI · 2 minutes after call wrap-up</text>
    </g>

    <g transform="translate(520, 20)">
      <rect width="108" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="16" cy="14" r="4.5" fill="#10B981"/>
      <text x="28" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065F46">Draft Ready</text>
    </g>

    <!-- Email Card Mockup -->
    <g transform="translate(32, 90)">
      <rect width="596" height="280" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

      <!-- Email metadata -->
      <g transform="translate(24, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">To:</text>
        <rect x="28" y="2" width="180" height="22" rx="11" fill="#E2E8F0"/>
        <text x="38" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Dominic Mills (dominic@mills.co)</text>

        <text x="0" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Subject:</text>
        <text x="64" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0B1A2C">Recap &amp; Action Items: Slotly Strategy Session</text>
      </g>

      <path d="M24 82 H572" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Email Body Content -->
      <g transform="translate(24, 102)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B1A2C">Hi Dominic,</text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569">Thank you for taking the time to meet today! Here is your quick recap and next steps:</text>

        <!-- Bullet Highlights -->
        <g transform="translate(0, 56)">
          <rect x="0" y="0" width="18" height="18" rx="6" fill="#DCFCE7"/>
          <path d="M5 9 L8 12 L13 6" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
          <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Finalized Q4 schedule alignment &amp; multi-calendar sync rule</text>

          <rect x="0" y="28" width="18" height="18" rx="6" fill="#DBEAFE"/>
          <path d="M5 37 L8 40 L13 34" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <text x="28" y="42" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Automated Stripe upfront payment enabled for all bookings</text>

          <rect x="0" y="56" width="18" height="18" rx="6" fill="#F3E8FF"/>
          <path d="M5 65 L8 68 L13 62" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
          <text x="28" y="70" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Next review session booked for Tuesday at 2:00 PM</text>
        </g>
      </g>
    </g>

    <!-- Bottom Action Ribbon -->
    <g transform="translate(32, 396)">
      <rect width="250" height="48" rx="24" fill="url(#primary-btn)"/>
      <path d="M28 24 H38 M33 19 L38 24 L33 29" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Send Recap Email</text>

      <g transform="translate(266, 0)">
        <rect width="210" height="48" rx="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="28" cy="24" r="6" fill="#10B981"/>
        <text x="46" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803D">Book Next Call</text>
      </g>

      <g transform="translate(492, 0)">
        <rect width="136" height="48" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="28" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">View PDF</text>
      </g>
    </g>
  </g>
</svg>