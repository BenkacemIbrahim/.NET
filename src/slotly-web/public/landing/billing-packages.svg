<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="b-pk-bg" x1="0" y1="0" x2="900" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="purple-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B1A2C" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1A2C" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="900" height="650" rx="28" fill="url(#b-pk-bg)"/>

  <g filter="url(#shadow-b)" transform="translate(100, 60)">
    <rect width="700" height="530" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Bundle Header -->
    <g transform="translate(36, 32)">
      <g transform="translate(0, 0)">
        <rect width="104" height="26" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="52" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">SAVE 15%</text>
      </g>

      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0B1A2C">5-Session Health &amp; Coaching Bundle</text>
      <text x="0" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Sell multi-appointment packages upfront with automated credit counters.</text>
    </g>

    <!-- Pricing Highlight Box -->
    <g transform="translate(36, 136)">
      <rect width="628" height="96" rx="20" fill="#FAF5FF" stroke="#F3E8FF" stroke-width="1.5"/>
      
      <g transform="translate(28, 26)">
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0B1A2C">$425.00</text>
        <text x="144" y="32" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" text-decoration="line-through">$500.00</text>
        <text x="0" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7C3AED">5 Credits Included · $85 per session</text>
      </g>

      <g transform="translate(450, 32)">
        <rect width="150" height="38" rx="19" fill="#FFFFFF" stroke="#E9D5FF"/>
        <circle cx="20" cy="19" r="6" fill="#7C3AED"/>
        <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7C3AED">5 Session Credits</text>
      </g>
    </g>

    <!-- Credit Tracking Grid -->
    <g transform="translate(36, 256)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B1A2C">Automated Credit Balance</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Clients can redeem slots anytime without re-entering payment info.</text>

      <g transform="translate(0, 48)">
        <!-- 5 credit tokens -->
        <g transform="translate(0, 0)">
          <rect width="114" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="57" cy="34" r="16" fill="#E0E7FF"/>
          <text x="57" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">1</text>
          <text x="57" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Session 1</text>
        </g>

        <g transform="translate(128, 0)">
          <rect width="114" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="57" cy="34" r="16" fill="#E0E7FF"/>
          <text x="57" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">2</text>
          <text x="57" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Session 2</text>
        </g>

        <g transform="translate(256, 0)">
          <rect width="114" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="57" cy="34" r="16" fill="#E0E7FF"/>
          <text x="57" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">3</text>
          <text x="57" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Session 3</text>
        </g>

        <g transform="translate(384, 0)">
          <rect width="114" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="57" cy="34" r="16" fill="#E0E7FF"/>
          <text x="57" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">4</text>
          <text x="57" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Session 4</text>
        </g>

        <g transform="translate(512, 0)">
          <rect width="114" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
          <circle cx="57" cy="34" r="16" fill="#E0E7FF"/>
          <text x="57" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">5</text>
          <text x="57" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Session 5</text>
        </g>
      </g>
    </g>

    <!-- Bottom Purchase Button -->
    <g transform="translate(36, 440)">
      <rect width="628" height="52" rx="26" fill="url(#purple-btn)"/>
      <text x="314" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Purchase 5-Session Bundle &amp; Book First Slot</text>
    </g>
  </g>
</svg>