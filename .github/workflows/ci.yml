name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate isolated CI environment
        shell: pwsh
        run: ./scripts/initialize-environment.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/slotly-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/slotly-web
        run: npm ci

      - name: Validate frontend
        working-directory: src/slotly-web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Slotly.sln

      - name: Build
        run: dotnet build Slotly.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Slotly.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Validate Compose configuration
        run: docker compose --env-file .env -f docker/compose.yml config --quiet

      - name: Build API image
        run: docker build --file docker/Dockerfile --tag slotly-api:ci .

      - name: Build web image
        run: docker build --build-arg VITE_API_URL=http://localhost:8080 --file docker/Dockerfile.web --tag slotly-web:ci .

      - name: Install Playwright browser
        working-directory: src/slotly-web
        run: npx playwright install --with-deps chromium

      - name: Start end-to-end stack
        run: docker compose --env-file .env -f docker/compose.yml up --build --detach --wait

      - name: Run browser journeys
        working-directory: src/slotly-web
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/slotly-web/playwright-report
          if-no-files-found: ignore

      - name: Stop end-to-end stack
        if: always()
        run: docker compose --env-file .env -f docker/compose.yml down --volumes
